root = "."
tmp_dir = "tmp"

[build]
  bin = "tmp/main"
  cmd = "templ generate && go build -o tmp/main ./cmd/server"
  delay = 1000
  exclude_dir = ["tmp", "node_modules", "data", "bin", ".git"]
  exclude_regex = ["_test\\.go$", "_templ\\.go$"]
  include_ext = ["go", "templ", "html", "css", "js"]
  kill_delay = "1s"
  log = "tmp/air-combined.log"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true
